<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="kit.css" />
    <script src="kit.js"></script>
    <style>
      .row {
        position: absolute;
        left: 32px;
        height: 14px;
        font: 400 11px/14px var(--mono);
        white-space: nowrap;
      }
      .dot {
        position: absolute;
        left: 20px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      #mk {
        position: absolute;
        left: 13px;
        width: 134px;
        height: 14px;
        border: 1px solid var(--accent);
        border-radius: 8px;
      }
      #phone {
        position: absolute;
        left: 184px;
        top: 44px;
        width: 196px;
        height: 148px;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      #notch {
        position: absolute;
        left: 83px;
        top: 8px;
        width: 28px;
        height: 3px;
        border-radius: 2px;
        background: var(--line);
      }
      #ptag {
        position: absolute;
        left: 12px;
        top: 7px;
        font: 700 11px/14px var(--ui);
        white-space: nowrap;
      }
      #ptag i {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        margin-right: 5px;
        vertical-align: 0;
      }
      #pbody {
        position: absolute;
        left: 9px;
        top: 30px;
        width: 176px;
        height: 108px;
      }
      .verdict #vl {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="inp" class="input"></div>
      <div id="list"></div>
      <div id="mk"></div>
      <div id="phone">
        <div id="notch"></div>
        <div id="ptag"></div>
        <div id="pbody"></div>
      </div>
      <div id="vhr" class="verdict-hr"></div>
      <div id="verdict" class="verdict">
        <span id="vl"></span><span id="vc" class="chip"></span>
      </div>
    </div>
    <script>
      const T0 = 250,
        S = 1650,
        BEF = 380,
        SW = 850,
        N = 11;
      const ROW0 = 42,
        ROWH = 14;
      const op = (u, s, d = 160) => easeOutCubic(progress(u, s, d));
      const A = (x, y, w, h, style, html = "") =>
        `<div style="position:absolute;left:${x}px;top:${y}px;${w != null ? `width:${w}px;` : ""}${h != null ? `height:${h}px;` : ""}${style}">${html}</div>`;
      const tx = (x, y, w, html, style = "") =>
        A(x, y, w, null, `font:500 11.5px/15px var(--ui);${style}`, html);
      const btn = (x, y, w, label, c = "var(--fg)", o = 1, h = 22) =>
        A(
          x,
          y,
          w,
          h,
          `border:1px solid ${c};border-radius:6px;color:${c};font:500 11px/${h - 2}px var(--ui);text-align:center;white-space:nowrap;opacity:${o}`,
          label,
        );
      const typed = (s, ms, cps = 60) => {
        const n = Math.floor(clamp((ms / 1000) * cps, 0, s.length));
        return (
          esc(s.slice(0, n)) + `<span class="hide">${esc(s.slice(n))}</span>`
        );
      };
      const bub = (x, y, w, html, o = 1, c = "var(--line)", tc = "var(--fg)") =>
        A(
          x,
          y,
          w,
          null,
          `border:1px solid ${c};border-radius:10px;padding:4px 9px;font:500 11.5px/16px var(--ui);color:${tc};box-sizing:border-box;opacity:${o}`,
          html,
        );
      const svg = (d, extra = "") =>
        `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${d}${extra}</svg>`;
      const ICONS = [
        svg('<path d="M6 1.5v9M1.5 6h9"/>'),
        svg('<path d="M1.5 6.5l3 3 6-7"/>'),
        svg(
          '<circle cx="2" cy="6" r=".6"/><circle cx="6" cy="6" r=".6"/><circle cx="10" cy="6" r=".6"/>',
        ),
      ];
      const TRASH = svg('<path d="M2 3h8M4.5 3V1.5h3V3M3 3l.5 7.5h5L9 3"/>');
      const CHECK = svg('<path d="M2 6.5l2.5 2.5 5.5-6.5"/>');
      const bar = (x, y, w, full, c, h = 5, track = "var(--subtle)") =>
        A(x, y, full, h, `border-radius:3px;background:${track}`) +
        A(x, y, w, h, `border-radius:3px;background:${c}`);

      const SK = [
        {
          n: "ux-benchmark",
          q: "60대 사용자가 늘었는데 송금 화면 어떻게 바꿀까",
          v: "Context → 위험 신호별 안",
          chip: "나이 대신 위험 신호",
          cc: "accent",
          bf: (b) =>
            tx(0, 0, 176, "받는 분", `color:var(--muted);font-size:10.5px;opacity:${op(b, 0)}`) +
            A(0, 14, 176, 18, `font:500 12.5px/18px var(--ui);opacity:${op(b, 0)}`, "김하늘") +
            A(0, 38, 176, 18, `font:700 13px/18px var(--mono);opacity:${op(b, 60)}`, "1,200,000원") +
            tx(0, 60, 176, "모두에게 같은 확인 화면", `color:var(--p1);opacity:${op(b, 160)}`) +
            btn(0, 84, 176, "보내기", "var(--fg)", op(b, 100)),
          af: (a) => {
            const fs = lerp(12.5, 17, easeOutCubic(progress(a, 0, 260)));
            const row = (y, t, s) =>
              A(
                0,
                y,
                176,
                15,
                `display:flex;align-items:center;gap:5px;font:500 11px/15px var(--ui);white-space:nowrap;opacity:${op(a, s)}`,
                `<span style="color:var(--accent);display:inline-flex">${CHECK}</span>${t}`,
              );
            return (
              A(0, 0, 176, 22, `font:700 ${fs.toFixed(1)}px/22px var(--ui)`, "김하늘") +
              A(
                0,
                25,
                null,
                16,
                `border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 6px;font:600 10.5px/14px var(--ui);white-space:nowrap;opacity:${op(a, 180)}`,
                "처음 보내는 계좌",
              ) +
              row(48, "직접 아는 분이에요", 300) +
              row(65, "급한 송금 요청이 아니에요", 380) +
              tx(0, 88, 176, "30분 뒤 도착 · 그 전엔 취소", `color:var(--ok);font-size:11px;opacity:${op(a, 470)}`)
            );
          },
        },
        {
          n: "ux-simulate",
          q: "기획서랑 링크 줄 테니 어떤 UX가 맞을지 봐 줘",
          v: "Synthetic persona → 가설",
          bf: (b) =>
            A(
              0,
              2,
              176,
              22,
              `font:500 12.5px/22px var(--ui);opacity:${op(b, 0)}`,
              `사용자 <b style="font:700 17px/22px var(--mono);color:var(--p1)">78%</b>가 B안 선호`,
            ) +
            tx(
              0,
              34,
              176,
              "→ 바로 개발",
              `color:var(--p1);font-weight:600;opacity:${op(b, 140)}`,
            ) +
            bar(
              0,
              62,
              176 * easeOutCubic(progress(b, 160, 280)),
              176,
              "var(--p1)",
            ),
          af: (a) => {
            const n = Math.floor(clamp((a - 380) / 70, 0, 5));
            let ppl = "";
            for (let i = 0; i < 5; i++)
              ppl += A(
                i * 20,
                88,
                12,
                12,
                `border:1px solid var(--ok);border-radius:50%;background:${i < n ? "var(--ok)" : "none"}`,
              );
            return (
              A(
                0,
                2,
                null,
                18,
                `border:1px solid var(--muted);color:var(--muted);border-radius:999px;padding:0 7px;font:600 11px/16px var(--ui);white-space:nowrap;opacity:${op(a, 0)}`,
                "합성 시뮬레이션 · 가설",
              ) +
              A(
                0,
                28,
                176,
                20,
                `font:700 15px/20px var(--ui);opacity:${op(a, 120)}`,
                "B안 추천",
              ) +
              tx(
                0,
                56,
                176,
                "→ 실제 사용자 5명으로 확인",
                `opacity:${op(a, 240)}`,
              ) +
              ppl
            );
          },
        },
        {
          n: "ux-research",
          q: "왜 온보딩 중간에 그만두는지 알고 싶어",
          v: "Leading question → Open question",
          bf: (b) =>
            bub(0, 4, 156, typed("새 온보딩, 편하셨죠?", b, 45)) +
            bub(130, 50, 46, "네.", op(b, 300), "var(--line)", "var(--muted)"),
          af: (a) => {
            const L = [140, 160, 96];
            let bars = "";
            L.forEach(
              (w, i) =>
                (bars += bar(
                  0,
                  62 + i * 13,
                  w * easeOutCubic(progress(a, 450 + i * 100, 130)),
                  w,
                  "var(--lowc)",
                  5,
                  "transparent",
                )),
            );
            return (
              bub(
                0,
                4,
                176,
                typed(
                  "마지막으로 가입하다 멈춘 때를 처음부터 들려주세요",
                  a,
                  62,
                ),
              ) + bars
            );
          },
        },
        {
          n: "ux-flow",
          q: "회원가입부터 첫 주문까지 화면 목록이랑 예외 경로",
          v: "Dead end → Recovery path",
          bf: (b) => {
            const w = 70 * easeOutCubic(progress(b, 160, 240));
            return (
              tx(
                0,
                8,
                176,
                "네트워크 오류. 잠시 후 다시 시도하세요",
                `opacity:${op(b, 0)}`,
              ) +
              A(0, 62, w, 2, "background:var(--p1);border-radius:1px") +
              A(70, 54, 2, 18, `background:var(--p1);opacity:${op(b, 360, 60)}`)
            );
          },
          af: (a) =>
            tx(
              0,
              4,
              176,
              "연결이 끊겼어요. 장바구니는 저장했어요",
              `opacity:${op(a, 0)}`,
            ) +
            A(
              0,
              48 + (1 - op(a, 150)) * 6,
              176,
              22,
              `opacity:${op(a, 150)}`,
              btn(0, 0, 176, "다시 시도", "var(--accent)"),
            ) +
            A(
              0,
              76 + (1 - op(a, 280)) * 6,
              176,
              22,
              `opacity:${op(a, 280)}`,
              btn(0, 0, 176, "오프라인으로 보기"),
            ),
        },
        {
          n: "ux-spec",
          q: "개발자한테 넘길 화면설계서",
          v: "Component states",
          bf: (b) =>
            btn(0, 6, 100, "저장", "var(--fg)", op(b, 0), 26) +
            A(
              0,
              46,
              176,
              18,
              `border-left:2px solid var(--p1);padding-left:8px;font:500 11.5px/18px var(--ui);color:var(--muted);opacity:${op(b, 200)}`,
              "누르면 저장",
            ),
          af: (a) => {
            const ST = [
              ["기본", "저장", "var(--fg)"],
              ["저장 중", "저장 중…", "var(--accent)"],
              ["완료", "저장했어요", "var(--ok)"],
              ["실패", "저장하지 못했어요", "var(--p1)"],
            ];
            const i = Math.min(3, Math.floor(a / 195));
            let lab = "";
            ST.forEach((s, k) => {
              const on = k === i;
              lab += A(
                k * 44,
                52,
                44,
                18,
                `font:${on ? 700 : 500} 11px/16px var(--ui);color:${on ? s[2] : "var(--lowc)"};border-bottom:2px solid ${on ? s[2] : "transparent"};text-align:center;white-space:nowrap`,
                s[0],
              );
            });
            return btn(0, 6, 140, ST[i][1], ST[i][2], 1, 28) + lab;
          },
        },
        {
          n: "ux-writing",
          q: "오류 문구 다듬어 줘",
          v: "Error message: 원인 + 해결",
          bf: (b) =>
            A(
              0,
              2,
              176,
              78,
              `border:1px solid var(--line);border-radius:10px;opacity:${op(b, 0)}`,
            ) +
            tx(
              10,
              10,
              156,
              "오류가 발생했습니다. (E-402)",
              `opacity:${op(b, 40)}`,
            ) +
            btn(58, 48, 60, "확인", "var(--fg)", op(b, 160)),
          af: (a) =>
            A(
              0,
              2,
              176,
              104,
              `border:1px solid var(--line);border-radius:10px;opacity:${op(a, 0)}`,
            ) +
            tx(
              10,
              10,
              156,
              "카드 한도를 넘어 결제하지 못했어요",
              `opacity:${op(a, 40)}`,
            ) +
            A(
              10,
              48 + (1 - op(a, 200)) * 5,
              156,
              22,
              `opacity:${op(a, 200)}`,
              btn(0, 0, 156, "다른 카드로 결제", "var(--accent)"),
            ) +
            A(
              10,
              74 + (1 - op(a, 330)) * 5,
              156,
              22,
              `opacity:${op(a, 330)}`,
              btn(0, 0, 156, "나중에 결제하기"),
            ),
        },
        {
          n: "ux-review",
          q: "삭제를 토스트로만 알리는데 되돌리기를 줄지",
          v: "Toast → Snackbar + Undo",
          bf: (b) => {
            const row = 1 - progress(b, 60, 100);
            const toast = op(b, 110, 100) * (1 - progress(b, 330, 100));
            return (
              A(
                0,
                6,
                176,
                26,
                `border:1px solid var(--line);border-radius:6px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;font:500 11.5px/24px var(--ui);box-sizing:border-box;opacity:${row}`,
                `<span>회의 메모</span><span style="color:${b > 20 ? "var(--p1)" : "var(--muted)"}">${TRASH}</span>`,
              ) +
              A(
                26,
                72 + (1 - op(b, 110, 100)) * 8,
                124,
                24,
                `border:1px solid var(--fg);border-radius:12px;font:500 11.5px/22px var(--ui);text-align:center;opacity:${toast}`,
                "삭제되었습니다",
              )
            );
          },
          af: (a) => {
            const sn = op(a, 0, 150) * (1 - progress(a, 690, 100));
            const row = op(a, 540, 100);
            const tap = progress(a, 440, 180);
            return (
              A(
                0,
                6,
                176,
                26,
                `border:1px solid var(--line);border-radius:6px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;font:500 11.5px/24px var(--ui);box-sizing:border-box;opacity:${row}`,
                `<span>회의 메모</span><span style="color:var(--muted)">${TRASH}</span>`,
              ) +
              A(
                0,
                72 + (1 - op(a, 0, 150)) * 14,
                176,
                28,
                `border:1px solid var(--fg);border-radius:8px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;font:500 11px/26px var(--ui);box-sizing:border-box;white-space:nowrap;opacity:${sn}`,
                `<span>노트를 삭제했어요</span><b style="color:var(--accent);font-weight:700">되돌리기</b>`,
              ) +
              A(
                112 - tap * 6,
                78 - tap * 6,
                48 + tap * 12,
                16 + tap * 12,
                `border:1px solid var(--accent);border-radius:999px;opacity:${tap > 0 && tap < 1 ? 1 - tap : 0}`,
              )
            );
          },
        },
        {
          n: "ux-a11y",
          q: "터치 영역 크기",
          v: "Target size",
          chip: "WCAG 2.5.8",
          cc: "accent",
          bf: (b) => iconRow(20, 2, "var(--p1)", "20×20px", op(b, 0)),
          af: (a) => {
            const p = easeOutCubic(progress(a, 60, 320));
            return iconRow(
              lerp(20, 44, p),
              lerp(2, 8, p),
              a > 340 ? "var(--ok)" : "var(--p1)",
              "44×44px",
              1,
            );
          },
        },
        {
          n: "ux-dark-patterns",
          q: "부가 서비스가 기본으로 체크돼 있는데 괜찮아?",
          v: "사전 선택",
          chip: "공정위 다크패턴 유형",
          cc: "accent",
          bf: (b) => dpRow(1, "var(--p1)", op(b, 0), 0),
          af: (a) => {
            const k = 1 - easeOutCubic(progress(a, 160, 200));
            return dpRow(
              k,
              k > 0 ? "var(--p1)" : "var(--muted)",
              1,
              op(a, 420),
            );
          },
        },
        {
          n: "ux-metrics",
          q: "성공 지표 정해 줘",
          v: "Vanity metric → Success metric + Guardrail",
          bf: (b) => {
            let r = "";
            ["페이지뷰", "클릭 수", "체류 시간"].forEach((l, i) => {
              r +=
                tx(
                  0,
                  6 + i * 28,
                  70,
                  l,
                  `color:var(--muted);opacity:${op(b, i * 70)}`,
                ) +
                bar(
                  70,
                  11 + i * 28,
                  106 * easeOutCubic(progress(b, 60 + i * 80, 260)),
                  106,
                  "var(--lowc)",
                  6,
                );
            });
            return r;
          },
          af: (a) =>
            tx(
              0,
              0,
              176,
              "주 지표",
              `font-size:11px;color:var(--muted);opacity:${op(a, 0)}`,
            ) +
            tx(
              0,
              14,
              176,
              "첫 주문 완료율",
              `font:700 14px/18px var(--ui);color:var(--accent);opacity:${op(a, 60)}`,
            ) +
            bar(
              0,
              36,
              120 * easeOutCubic(progress(a, 160, 320)),
              176,
              "var(--accent)",
              6,
            ) +
            tx(
              0,
              56,
              176,
              "가드레일",
              `font-size:11px;color:var(--muted);opacity:${op(a, 380)}`,
            ) +
            tx(
              0,
              70,
              176,
              "오류 문의 수",
              `font:700 14px/18px var(--ui);color:var(--ok);opacity:${op(a, 440)}`,
            ) +
            bar(
              0,
              92,
              40 * easeOutCubic(progress(a, 540, 220)),
              176,
              "var(--ok)",
              6,
            ) +
            A(120, 88, 1, 14, `background:var(--lowc);opacity:${op(a, 540)}`),
        },
        {
          n: "ux-ai",
          q: "답변에 출처랑 다시 생성 버튼을 어떻게 넣을지",
          v: "Source · Stop · Regenerate",
          bf: (b) => aiAnswer(b, 90),
          af: (a) => {
            const done = a >= 330;
            return (
              aiAnswer(a, 90, "var(--ok)") +
              A(
                0,
                40,
                null,
                18,
                `border:1px solid var(--muted);color:var(--muted);border-radius:999px;padding:0 7px;font:600 11px/16px var(--ui);opacity:${op(a, 380)}`,
                "출처 1",
              ) +
              A(
                52,
                40,
                null,
                18,
                `border:1px solid var(--muted);color:var(--muted);border-radius:999px;padding:0 7px;font:600 11px/16px var(--ui);opacity:${op(a, 450)}`,
                "출처 2",
              ) +
              btn(0, 64, 56, "중지", done ? "var(--muted)" : "var(--p1)", 1) +
              btn(
                62,
                64,
                80,
                "다시 생성",
                done ? "var(--accent)" : "var(--muted)",
                done ? 1 : 0.45,
              ) +
              tx(
                0,
                91,
                176,
                "AI 답은 틀릴 수 있어요",
                `font-size:11px;color:var(--muted);opacity:${op(a, 560)}`,
              )
            );
          },
        },
      ];

      function aiAnswer(u, cps, c = "var(--p1)") {
        return A(
          0,
          2,
          176,
          32,
          `border-left:2px solid ${c};padding-left:8px;font:500 11.5px/16px var(--ui)`,
          typed("이 기능은 모든 요금제에서 쓸 수 있습니다.", u, cps),
        );
      }
      function iconRow(s, g, c, label, o) {
        const total = 3 * s + 2 * g,
          x0 = (176 - total) / 2,
          cy = 34;
        let r = "";
        for (let i = 0; i < 3; i++)
          r += A(
            x0 + i * (s + g),
            cy - s / 2,
            s,
            s,
            `border:1px solid ${c};border-radius:${s > 30 ? 8 : 4}px;display:grid;place-items:center;color:var(--fg);opacity:${o}`,
            ICONS[i],
          );
        return (
          r +
          A(
            0,
            66,
            176,
            16,
            `font:600 11px/16px var(--mono);color:${c};text-align:center;opacity:${o}`,
            label,
          )
        );
      }
      function dpRow(k, c, o, capO) {
        return (
          A(
            0,
            18,
            16,
            16,
            `border:1px solid ${k > 0 ? c : "var(--fg)"};border-radius:4px;display:grid;place-items:center;color:${c};opacity:${o}`,
            `<span style="opacity:${k};transform:scale(${0.5 + 0.5 * k});display:grid">${CHECK}</span>`,
          ) +
          A(
            26,
            12,
            150,
            15,
            `font:500 12px/15px var(--ui);opacity:${o}`,
            "부가 서비스 추가",
          ) +
          A(
            26,
            28,
            150,
            15,
            `font:700 12px/15px var(--mono);color:${k > 0 ? "var(--p1)" : "var(--muted)"};opacity:${o}`,
            "+2,900원",
          ) +
          A(
            0,
            62,
            176,
            30,
            `font:500 11.5px/15px var(--ui);color:var(--ok);opacity:${capO}`,
            "기본 해제<br>사용자가 직접 고름",
          )
        );
      }

      // 스킬 목록
      $("list").innerHTML = SK.map(
        (s, i) =>
          `<i class="dot" id="d${i}" style="top:${ROW0 + i * ROWH + 4}px"></i><span class="row" id="r${i}" style="top:${ROW0 + i * ROWH}px">${s.n}</span>`,
      ).join("");

      const mixc = (a, b, p) =>
        `color-mix(in srgb, ${a} ${(100 * (1 - p)).toFixed(1)}%, ${b})`;

      window.CARD = defineCard({
        end: T0 + N * S,
        draw(t) {
          fade($("vhr"), t, 100);
          fade($("phone"), t, 100);
          const k = t - T0;
          const cur = k < 0 ? -1 : Math.min(N - 1, Math.floor(k / S));
          const u = cur < 0 ? -1 : k - cur * S;
          for (let i = 0; i < N; i++) {
            const st = i < cur ? "done" : i === cur && u >= 90 ? "cur" : "pend";
            const row = $("r" + i),
              dot = $("d" + i);
            row.style.color =
              st === "cur"
                ? "var(--accent)"
                : st === "done"
                  ? "var(--lowc)"
                  : "var(--muted)";
            row.style.fontWeight = st === "cur" ? 600 : 400;
            dot.style.background =
              st === "cur"
                ? "var(--accent)"
                : st === "done"
                  ? "var(--lowc)"
                  : "none";
            dot.style.border = st === "pend" ? "1px solid var(--line)" : "none";
          }
          const mk = $("mk");
          if (cur < 0) {
            mk.style.opacity = 0;
            $("inp").innerHTML = "";
            $("vl").style.visibility = "hidden";
            $("vc").style.visibility = "hidden";
            $("ptag").innerHTML = "";
            $("pbody").innerHTML = "";
            $("phone").style.borderColor = "var(--line)";
            return;
          }
          const sk = SK[cur],
            last = cur === N - 1;
          const pos =
            cur === 0
              ? 0
              : lerp(cur - 1, cur, easeInOutCubic(progress(u, -30, 230)));
          mk.style.top = ROW0 + pos * ROWH + "px";
          mk.style.opacity = cur === 0 ? op(u, 0, 200) : 1;
          typeInto($("inp"), sk.q, u, 0, 70, 0);

          const outS = last ? Infinity : S - 120;
          $("vl").textContent = sk.v;
          fade($("vl"), u, 420, 200, outS, 100);
          const vc = $("vc");
          vc.textContent = sk.chip || "고친 후";
          vc.className = "chip " + (sk.cc || "ok");
          fade(vc, u, SW + 120, 200, outS, 100);

          const inP = progress(u, BEF, 120),
            out = last ? 0 : progress(u, S - 130, 130);
          const sw = progress(u, SW - 20, 140);
          const vis = inP * (1 - out);
          const after = u >= SW;
          const col = mixc("var(--p1)", "var(--ok)", sw);
          $("phone").style.borderColor = mixc("var(--line)", col, vis);
          const tag = $("ptag");
          tag.innerHTML = `<i></i>${after ? "고친 후" : "고치기 전"}`;
          tag.style.color = col;
          tag.style.opacity = vis;
          const dip = 1 - clamp(1 - Math.abs(u - SW) / 70);
          const body = $("pbody");
          body.style.opacity = vis * dip;
          body.innerHTML =
            u < BEF ? "" : after ? sk.af(u - SW) : sk.bf(u - BEF);
        },
      });
    </script>
  </body>
</html>
